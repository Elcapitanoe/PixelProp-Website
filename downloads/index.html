<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads | Pixel Prop Project</title>
  <link rel="icon" type="image/png" href="../src/pixelprop-logo-rc.png" />
  <meta name="description" content="Download the latest Pixel Prop systemless modules." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="../style.css" rel="stylesheet" />
  <style>
    .bg-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
    }

    .dark .bg-grid {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }
  </style>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
</head>

<body
  class="antialiased bg-white dark:bg-[#020617] text-slate-900 dark:text-white min-h-screen flex flex-col overflow-x-hidden selection:bg-blue-500/30">

  <my-header></my-header>

  <main class="flex-grow relative pt-32 pb-24 px-4 overflow-hidden">
    <div class="absolute inset-0 bg-grid [mask-image:linear-gradient(to_bottom,white,transparent)] pointer-events-none">
    </div>
    <div
      class="absolute top-0 left-1/2 -translate-x-1/2 -mt-20 w-[600px] h-[600px] bg-blue-500/10 dark:bg-blue-500/20 rounded-full blur-[120px] pointer-events-none">
    </div>

    <div class="relative z-10 max-w-5xl mx-auto">
      <div class="text-center mb-16">
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-500/10 border border-blue-100 dark:border-blue-500/20 text-blue-600 dark:text-blue-400 text-xs font-semibold tracking-wide uppercase mb-6 shadow-sm">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
          </span>
          GitHub Releases
        </div>
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-slate-900 dark:text-white mb-6">
          Latest Releases
        </h1>
        <p class="text-lg text-slate-600 dark:text-slate-400 max-w-xl mx-auto leading-relaxed">
          Download official stable and beta systemless modules directly from GitHub releases.
        </p>
      </div>

      <div id="latestBlock" class="space-y-8">
        <div
          class="bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-3xl p-8 shadow-xl shadow-slate-200/50 dark:shadow-none animate-pulse">
          <div class="flex flex-col md:flex-row justify-between gap-8 mb-8">
            <div class="space-y-4 w-full md:w-1/2">
              <div class="h-8 bg-slate-200 dark:bg-white/10 rounded-lg w-3/4"></div>
              <div class="h-4 bg-slate-200 dark:bg-white/10 rounded-lg w-1/2"></div>
            </div>
            <div class="h-12 bg-slate-200 dark:bg-white/10 rounded-xl w-full md:w-1/3"></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div
              class="h-40 bg-slate-50 dark:bg-white/5 rounded-2xl w-full border border-slate-100 dark:border-white/5">
            </div>
            <div
              class="h-40 bg-slate-50 dark:bg-white/5 rounded-2xl w-full border border-slate-100 dark:border-white/5">
            </div>
            <div
              class="h-40 bg-slate-50 dark:bg-white/5 rounded-2xl w-full border border-slate-100 dark:border-white/5">
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="checksumModal" class="fixed inset-0 z-[100] hidden" aria-labelledby="modal-title" role="dialog"
    aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" id="modalBackdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-center justify-center p-4 text-center">
        <div
          class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-[#0B1120] text-left shadow-2xl transition-all w-full max-w-lg border border-slate-200 dark:border-white/10 p-6">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div class="flex items-center gap-3">
              <span class="p-2 rounded-xl bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-500/20 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
              </span>
              <div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight">Checksum Verification</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate max-w-xs sm:max-w-sm" id="modalFileName"></p>
              </div>
            </div>
            <button type="button" id="modalCloseBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 transition" aria-label="Close">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>

          <div class="space-y-3">
            <div>
              <span class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5">Official Release Hash</span>
              <div class="relative bg-slate-50 dark:bg-black/40 rounded-xl p-3 border border-slate-200 dark:border-white/10 flex items-center justify-between gap-3">
                <code id="modalChecksumData" class="text-xs font-mono text-slate-700 dark:text-slate-300 break-all select-all leading-relaxed">Loading...</code>
                <button type="button" id="modalCopyBtn" class="shrink-0 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition active:scale-95 shadow-sm shadow-blue-500/20">
                  Copy
                </button>
              </div>
            </div>

            <div>
              <span class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5">Verify Downloaded File</span>
              <label id="dropZone" class="group relative flex flex-col items-center justify-center p-3.5 border-2 border-dashed border-slate-200 dark:border-white/10 hover:border-blue-500/50 dark:hover:border-blue-500/50 rounded-xl cursor-pointer bg-slate-50/50 dark:bg-white/[0.02] hover:bg-blue-50/30 dark:hover:bg-blue-500/[0.03] transition">
                <input type="file" id="fileVerifierInput" accept=".zip" class="sr-only" />
                <div class="flex items-center gap-2 text-xs text-slate-600 dark:text-slate-400">
                  <svg class="w-4 h-4 text-slate-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                  <span id="verifierPromptText"><strong class="font-semibold text-slate-900 dark:text-white">Choose .zip file</strong> or drag & drop</span>
                </div>
              </label>
              
              <div id="verifierResult" class="hidden mt-2 p-3 rounded-xl border text-xs font-mono"></div>
            </div>

            <p class="text-[11px] text-slate-400 dark:text-slate-500 pt-1">
              Verification runs 100% locally in your browser via <code class="font-mono text-slate-600 dark:text-slate-400">Web Crypto API</code>. No files are uploaded.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <my-footer></my-footer>
  <script src="../components/header.js"></script>
  <script src="../components/footer.js"></script>
  <script type="module" src="../script.js"></script>
</body>

</html>
